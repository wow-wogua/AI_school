# 前端容器：静态资源 + /api 反代到后端容器（替代 vite dev proxy）
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # 荣誉证书上传上限（后端 multipart 10MB，留余量）
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://report-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
