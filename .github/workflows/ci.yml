# CI：推送/PR 到 main 时验证后端可打包、前端可构建（不跑接口测试——那需 MySQL/Redis/MinIO 栈）
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 打包（跳过测试）
        working-directory: report-server
        run: mvn -B package -DskipTests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: report-web/package-lock.json
      - name: 安装依赖
        working-directory: report-web
        run: npm install
      - name: 构建
        working-directory: report-web
        run: npm run build
